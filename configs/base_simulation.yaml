# Base simulation configuration for OmniOpinion
simulation:
  n_agents: 2000
  n_dims: 4
  n_steps: 100
  snapshot_interval: 5
  dt: 0.15
  noise_std: 0.01
  base_epsilon: 0.45
  base_assimilation_bias: 1.25
  n_candidates: 3
  n_districts: 10
  n_news_items: 50
  er_alpha: 1.3
  er_bins: 4

electoral:
  indifference_threshold: -1.65
  rationality_lambda: 4.0
  noise_scale: 0.12

io:
  hdf5_compression: "gzip"
  buffer_size: 10
