# ==============================================================================
# OmniOpinion Configuration: Traditional Media Vehicle Groups (TV, Radio, Press)
# Built on top of the Empirical Brazilian Local Interpersonal Baseline
#
# Empirical Brazilian Media Access References:
# 1. Television (TV Aberta / Paga):
#    - IBGE, PNAD Continua TIC 2022/2023 (Acesso a Internet e a Televisao, 2023):
#      TV sets present in 94.4% of Brazilian households (69.2M households).
#    - Kantar IBOPE Media, Inside Video 2023/2024:
#      78.9% weekly linear TV reach (~56% daily), 5h17m average daily viewing duration,
#      with strong positive age gradient (adults 60+ watch >6.5h/day vs. <2.5h/day in 16-24)
#      and primary news reliance in lower/middle SES (Classes C/D/E).
# 2. Radio (Radio AM/FM):
#    - Kantar IBOPE Media, Inside Audio / Inside Radio 2023 & ABERT (2023):
#      80%-83% reach in the 13 main Brazilian metropolitan areas (3h55m/day average),
#      peaking among working-age commuters (30-59 years) and older adults across middle/working SES.
# 3. Written Press (Jornais Impressos, Revistas e Portais da Imprensa Tradicional):
#    - Reuters Institute for the Study of Journalism (Oxford), Digital News Report 2023/2024
#      (Brazil chapter, R. Carro), IVC Brasil (2023), & SECOM Pesquisa Brasileira de Midia (PBM):
#      Direct print circulation (~7-11%) and traditional press portals (~28-34%) are heavily
#      concentrated in high socioeconomic status (Classes A/B, college-educated, SES >= 0.65)
#      and adults aged 30+.
#
# Published Theoretical Models Implemented:
# - Mullainathan, S., & Shleifer, A. (2005). "The Market for News." American Economic Review, 95(4), 1031-1053.
# - Gentzkow, M., & Shapiro, J. M. (2006). "Media Bias and Reputation." JPE, 114(2), 280-316.
# - DellaVigna, S., & Kaplan, E. (2007). "The Fox News Effect: Media Bias and Voting." QJE, 122(3), 1187-1234.
# - Wu, F., & Huberman, B. A. (2007). "Novelty and collective attention." PNAS, 104(45), 17599-17601.
# - Leskovec, J., Backstrom, L., & Kleinberg, J. (2009). "Meme-tracking and the dynamics of the news cycle." KDD.
# - McCombs, M. E., & Shaw, D. L. (1972). "The Agenda-Setting Function of Mass Media." POQ, 36(2), 176-187.
# ==============================================================================

simulation:
  n_agents: 100000
  n_dims: 4
  n_steps: 800
  snapshot_interval: 50
  checkpoint_interval: 50
  n_candidates: 3
  n_districts: 10
  n_news_items: 1
  init_mode: "uniform_random"
  age_distribution: "ibge_2022"
  base_epsilon: 0.42
  base_assimilation_bias: 1.15
  dt: 0.15
  noise_std: 0.008
  er_alpha: 1.3
  er_bins: 4

media:
  enabled: true
  traditional_enabled: true
  social_enabled: false
  n_vehicle_groups: 1
  fact_rate: 1.5
  gatekeeping_sigma: 0.85
  broadcast_strength: 0.06
  traditional_selectivity_beta: 1.2
  beta: 0.0
  emotional_boost: 0.0
  feed_strength: 0.0
  whatsapp_trust: 0.0
  whatsapp_forward_prob: 0.0

networks:
  mean_family_size: 2.79
  work_school_mean_deg: 10
  church_mean_deg: 7
  friends_k: 6
  friends_p: 0.15
  weak_ties_mean_deg: 4
  layer_weights:
    family: 0.36
    work_school: 0.26
    church_community: 0.14
    friends: 0.14
    weak_ties: 0.10

electoral:
  indifference_threshold: -1.65
  rationality_lambda: 4.0
  noise_scale: 0.12

io:
  hdf5_compression: "lzf"
  buffer_size: 25
  save_full_trajectory: false
