[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-opinion"
version = "0.1.0"
description = "High-performance stochastic framework for multidimensional opinion dynamics, misinformation diffusion on multiplex networks, competitive media ecosystems, and electoral projection on SLURM clusters."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cesar Renno-Costa"}
]
dependencies = [
    "numpy>=1.24.0",
    "numba>=0.57.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "pytest>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
